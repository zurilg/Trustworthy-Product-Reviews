<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LOGIN MODAL</title>
</head>
<body>
    <div th:fragment="login" class="login-modal">
        <div class="login-frame">
            <h2>Login</h2>
            <label>Username:
                <input class="text-input" type="text" id="login-user"/>
            </label>
            <div class="flex-columns-spacebetween">
                <button class="login-button button-blue">Login</button>
                <button class="login-close button-red">Close</button>
            </div>
            <span class="error-text"></span>
            <p>If you don't have an account yet create one <a href="/registerUser">here</a>.</p>
        </div>
    </div>
</body>
</html>
