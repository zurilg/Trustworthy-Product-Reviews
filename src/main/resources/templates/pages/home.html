<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout.html}">
<head>
    <meta charset="UTF-8">
    <title>TrustworthyProductReviews - Home</title>
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>
<article layout:fragment="content">
    <div th:if="${errorMessage}" style="color: red; border: 1px solid #ffcccc; background-color: #ffeaea;
    padding: 10px; margin: 0 auto; max-width: 800px; text-align: center">
        <span th:text="${errorMessage}">Validation Error Message</span>
    </div>


    <div class="header-row">
        <div>
            <h1 th:if="${currentCategory != null}" th:text="${currentCategory.getName()}" class="page-title"></h1>

            <h1 th:unless="${currentCategory != null}" class="page-title">All Products</h1>
        </div>

        <div class="header-action-button">
            <div class="logged-out">
                <a class="add-product-link-logged-out">Log in to add a Product</a>
            </div>
            <div class="logged-in">
                <a th:href="@{/addProduct}" class="add-button">Add a Product</a>
            </div>
        </div>
    </div>

    <div class = "product-list-container">
        <div th:if="${#lists.isEmpty(products)}">
            <p>No products available.</p>
        </div>

        <div class="product-grid">
            <div th:each="product: ${products}" class="product-card">
                <a th:href="${'/product/' + product.getId().toString()}" class="product-image-link">
                    <img th:src="${product.getPictureURL()}"
                         th:alt="${product.getName()}"
                         class="product-image"/>
                </a>

                <div class="product-info">
                    <a th:href="${'/product/' + product.getId()}" class="product-name-link">
                        <p th:text="${product.getName()}" class="product-name"></p>
                    </a>

                    <div class="product-rating">
                        <span th:text="${#numbers.formatDecimal(product.avgRating(), 1, 1, 'POINT')}">0</span>
                        <span class="star-icon">★</span>
                        <span class="review-count" th:text="${'(' + #lists.size(product.getReviews()) + ' reviews)'}"> (0 reviews)</span>
                    </div>

                    <a th:href="${'/category/' + product.getCategory().getId()}" class="product-category-link">
                        <p th:text="${product.getCategory().getName()}" class="product-category"></p>
                    </a>
                </div>
            </div>
        </div>

        <div class="header-action-button">
            <div class="logged-out">
                <a class="add-product-link-logged-out">Log in to add a Product</a>
            </div>
            <div class="logged-in">
                <a th:href="@{/addProduct}" class="add-product-link">Add a Product</a>
            </div>
        </div>

        <div class="discover-more" th:if="${currentUser != null}" style="margin-top: 2rem;">
            <p>Discover other reviewers:</p>
            <ul>
                <li><a th:href="@{/users/similar}">Find similar users (Jaccard distance)</a></li>
                <li><a th:href="@{/users/most-followed}">See most-followed reviewers</a></li>
            </ul>
        </div>
    </div>

</article>
</body>
</html>
