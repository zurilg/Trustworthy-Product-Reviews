<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout.html}">
<head>
    <meta charset="UTF-8">
    <title>TrustworthyProductReviews - Product</title>
    <link rel="stylesheet" href="/css/product.css" />
</head>
<body>
<article layout:fragment="content">
    <div class="product-columns">
        <div class="product-info border">
            <div class="title-block flex-columns-spacebetween">
                <h2>Crate</h2>
                <div class="rating-block">
                    <div class="icon-box">
                        <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                        <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                        <img src="/images/star_half.svg" alt="Star Half Filled" width="16"/>
                        <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
                        <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
                    </div>
                    <p>(200)</p>
                </div>
            </div>
            <img src="https://m.media-amazon.com/images/I/81NKzEV0+2L.jpg"  alt="Product Image" width="400px"/>
            <div class="flex-columns-spacebetween">
                <p>Category: Containers</p>
                <p>Created: 2025-10-29</p>
            </div>
        </div>
        <div class="your-review border">
            <h3>Your Review</h3>
            <p>Username</p>
            <div class="rating-block flex-columns-spacebetween">
                <div class="rating-controls">
                    <button>-</button>
                    <div class="icon-box">
                        <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                        <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                        <img src="/images/star_half.svg" alt="Star Half Filled" width="16"/>
                        <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
                        <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
                    </div>
                    <button>+</button>
                </div>
                <p>Reviewed: 2025-10-29</p>
            </div>
            <textarea id="rating-text">

            </textarea>
            <div class="flex-columns-spacebetween">
                <button>Review</button>
                <button>Delete</button>
            </div>
        </div>
    </div>
    <div class="all-reviews border">
        <div class="all-reviews-header">
            <h3>All Reviews</h3>
            <div class="icon-box">
                <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                <img src="/images/star_half.svg" alt="Star Half Filled" width="16"/>
                <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
                <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
            </div>
            <p>(200 Reviews)</p>
        </div>
        <div class="review border">
            <p>User1</p>
            <div class="rating-block">
                <div class="icon-box">
                    <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                    <img src="/images/star_fill.svg" alt="Star Filled" width="16"/>
                    <img src="/images/star_half.svg" alt="Star Half Filled" width="16"/>
                    <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
                    <img src="/images/star_out.svg" alt="Star Empty" width="16"/>
                </div>
                <p>2025-10-29</p>
            </div>
            <p>It was a very cool crate.</p>
        </div>
        <div class="page-controls">
            <button>First</button>
            <button>Prev</button>
            <p>1</p>
            <button>Next</button>
            <button>Last</button>
        </div>
    </div>
</article>
</body>
</html>
