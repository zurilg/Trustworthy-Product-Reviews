<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout.html}">
<head>
    <meta charset="UTF-8">
    <title>TrustworthyProductReviews - User Registration</title>

    <script src="/js/registerUser.js"></script>
</head>
<body>
<article layout:fragment="content">

    <h2>Register a New User</h2>
    <form class="register-form" action="#">
        <table>
            <tr>
                <td>Display Name:</td>
                <td><input type="text" name="displayname" id="displayname"/></td>
                <td id="displayname-error">Name Error</td>
            </tr>
            <tr>
                <td>Username:</td>
                <td><input type="text" name="username" id="username"/></td>
                <td id="username-error">Name Error</td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" name="email" id="email"/></td>
                <td id="email-error">Name Error</td>
            </tr>
            <tr>
                <td>
                    <button type="submit" value="Submit">Register</button>
                    <div></div>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </table>
    </form>
</article>
</body>
</html>
