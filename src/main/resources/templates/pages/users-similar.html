<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.thymeleaf.org" layout:decorate="~{layout.html}">
<head>
    <meta charset="UTF-8">
    <title>Similar Users</title>
</head>
<body>
<article layout:fragment="content">
    <div class="user-search border" style="max-width: 900px; margin: 0 auto;">
        <h2 th:text="'Users similar to ' + ${currentUser.displayName}"></h2>
        <p>Sorted by ascending Jaccard distance.</p>
        <table style="width:100%; border-collapse: collapse;">
            <thead>
            <tr>
                <th style="text-align:left; border-bottom: 1px solid #ccc;">Display Name</th>
                <th style="text-align:left; border-bottom: 1px solid #ccc;">Username</th>
                <th style="text-align:left; border-bottom: 1px solid #ccc;">Jaccard Distance</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(userSimilarities)}">
                <td colspan="3">No other users available.</td>
            </tr>
            <tr th:each="view : ${userSimilarities}">
                <td>
                    <a th:href="@{/profile/{id}(id=${view.user.getId()})}" th:text="${view.user.displayName}">Display Name</a>
                </td>
                <td th:text="${view.user.userName}"></td>
                <td th:text="${#numbers.formatDecimal(view.distance, 1, 3)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</article>
</body>
</html>
