<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout.html}">
<head>
    <meta charset="UTF-8">
    <title>Most Followed Users</title>
</head>
<body>
<article layout:fragment="content">
    <div class="user-search border" style="max-width: 900px; margin: 0 auto;">
        <h2 th:text="'Most-followed users (viewed as ' + ${currentUser.displayName} + ')'"></h2>
        <table style="width:100%; border-collapse: collapse;">
            <thead>
            <tr>
                <th style="text-align:left; border-bottom: 1px solid #ccc;">Display Name</th>
                <th style="text-align:left; border-bottom: 1px solid #ccc;">Username</th>
                <th style="text-align:left; border-bottom: 1px solid #ccc;">Followers</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(followerCounts)}">
                <td colspan="3">No users to display.</td>
            </tr>
            <tr th:each="view : ${followerCounts}">
                <td th:text="${view.user.displayName}"></td>
                <td th:text="${view.user.userName}"></td>
                <td th:text="${view.followerCount}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</article>
</body>
</html>
